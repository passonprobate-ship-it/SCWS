# Project: spawn-browser (port 5046)
# Shared Chromium browser — noVNC web UI + websocket. Managed manually.

# Convenience: /browser and bare /spawn-browser/ land straight in the viewer
location = /browser {
    return 302 /spawn-browser/vnc.html?autoconnect=true&resize=scale&path=spawn-browser/websockify;
}
location = /spawn-browser/ {
    return 302 /spawn-browser/vnc.html?autoconnect=true&resize=scale&path=spawn-browser/websockify;
}

# VNC websocket
location = /spawn-browser/websockify {
    proxy_pass http://127.0.0.1:5046/websockify;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;
}

# noVNC static web UI
location /spawn-browser/ {
    proxy_pass http://127.0.0.1:5046/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Base-Path /spawn-browser;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @project_down;
}
